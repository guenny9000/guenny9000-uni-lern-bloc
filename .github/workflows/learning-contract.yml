name: V91 Learning Contract

on:
  push:
    paths:
      - "contracts/**"
      - "tools/**"
      - "tests/test_learning_contract.py"
      - ".github/workflows/learning-contract.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "tools/**"
      - "tests/test_learning_contract.py"
      - ".github/workflows/learning-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contract structure
        run: python tools/validate_learning_contract.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_learning_contract.py" -v
